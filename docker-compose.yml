services:
  updateapecprofile:
    image: ghcr.io/blackbol/update-apec-profile:latest
    build: .
    container_name: UpdateApecProfile
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
      - APEC_USERNAME=ton_email@exemple.com
      - APEC_PASSWORD=ton_mot_de_passe
      # Rotation des postes (obligatoire, séparés par des virgules) :
      - POSTE_DU_JOUR=Ingénieur logiciel, Développeur logiciel, Lead Développeur
      # Planification au format cron standard (ex: 0 8 * * * pour tous les jours à 08h00) :
      - CRON_SCHEDULE=0 8 * * *
      # Exécute une mise à jour dès le démarrage du conteneur (true/false) :
      - RUN_ON_STARTUP=true
      - LOG_LEVEL=INFO
    volumes:
      # Persistance des cookies de session
      - ./data:/app/data
